name: keepalive

# Render's free tier stops the API after fifteen idle minutes, and the first request back waits
# about forty seconds — long enough that a reviewer opening the live link meets a login screen
# that hangs and concludes the thing is broken. A request every five minutes keeps it awake.
#
# Five minutes and not fourteen because scheduled runs drift when the hosted runners are busy;
# at this interval three consecutive late slots still land inside the idle window.
#
# What it costs: the free tier allows 750 instance hours a month and an always-awake service
# burns about 730 of them, so this fits only while the API is the only free service on the
# account. Narrowing the schedule to '*/5 4-23 * * *' buys the margin back and leaves the hours
# nobody in either timezone is likely to click.
on:
  schedule:
    - cron: '*/5 * * * *'
  # So the API can be woken on demand — before recording the demo, for one.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # --fail makes a 5xx a red run rather than a green one that pinged a broken service.
      # --max-time covers a cold start, which this job exists to prevent and which still
      # happens on the first run after a deploy.
      - name: Ping the API health endpoint
        run: >-
          curl --fail --silent --show-error --retry 2 --retry-connrefused
          --max-time 120 https://paybands-api.onrender.com/health
