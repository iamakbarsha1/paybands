name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration tests run against this, not a mock and not a cloud branch (decision 44).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paybands
          POSTGRES_PASSWORD: paybands
          POSTGRES_DB: paybands_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paybands -d paybands_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://paybands:paybands@localhost:5432/paybands_test

    steps:
      - uses: actions/checkout@v7

      # Reads the version from packageManager, so CI and the lockfile agree.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails on an uncommitted lockfile rather than silently resolving new versions.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser the smoke project drives. `--with-deps` pulls the shared libraries
      # Chromium needs on a bare runner; without it the launch fails rather than skips.
      - name: Install Chromium
        run: pnpm --filter @paybands/api exec playwright install --with-deps chromium

      # Four named steps, so a red build says which gate failed without opening the log.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
